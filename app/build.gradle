plugins {
    id 'com.android.application'
}

android {
    namespace 'com.migmargv.tensorviewvr'
    compileSdk 34
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.migmargv.tensorviewvr"
        minSdk 32
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildFeatures { prefab true }

    // Throw-away signing key generated by setup_tensorview.sh (release.keystore is git-ignored).
    signingConfigs {
        release {
            storeFile file("../release.keystore")
            storePassword "tensorview"
            keyAlias "tensorview"
            keyPassword "tensorview"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.release }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            debuggable false
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.57'
}
