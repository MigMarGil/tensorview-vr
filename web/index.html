<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>TensorView VR — spatial neural-network profiler (WebXR, IWSDK)</title>
<meta name="description" content="Inspect neural networks in 3D with your bare hands: point, pinch, grab and zoom through ONNX model graphs. Built with the Immersive Web SDK for Meta Quest.">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #010205; overflow: hidden; font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color: #e8f0ff; }
  #scene-container, #scene-container canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 22px; box-sizing: border-box; gap: 20px; }
  #top h1 { margin: 0; font-size: 22px; letter-spacing: .5px; color: #7fd8ff; }
  #top p { margin: 4px 0 0; font-size: 13px; color: #9fb4d8; max-width: 560px; line-height: 1.4; }
  #bottom { display: flex; flex-direction: column; gap: 12px; align-items: flex-end; max-width: 380px; }
  button#enter { pointer-events: auto; font: 700 18px "Segoe UI", system-ui, sans-serif; padding: 14px 26px; border-radius: 14px; border: 2px solid #8fd0ff; background: #17408a; color: #fff; cursor: pointer; }
  button#enter:disabled { opacity: .55; cursor: default; border-color: #4a5a7a; background: #1a2440; }
  button#enter:hover:not(:disabled) { background: #2358b8; }
  #hint { font-size: 13px; color: #9fb4d8; max-width: 380px; line-height: 1.45; background: rgba(8,13,28,.72); padding: 8px 12px; border-radius: 10px; }
  #hint b { color: #fff; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; font-size: 28px; background: rgba(10,30,70,.75); z-index: 5; }
  body.in-vr #ui { display: none; }
</style>
</head>
<body>
<div id="scene-container"></div>
<div id="ui">
  <div id="top">
    <h1>TENSORVIEW VR</h1>
    <p>Spatial neural-network profiler. Load an ONNX model, walk through its graph in 3D and inspect every layer with your hands.</p>
  </div>
  <div id="bottom">
    <button id="enter" disabled>CHECKING WEBXR…</button>
    <div id="hint"></div>
  </div>
</div>
<div id="drop">Drop an .onnx file to inspect it</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
